{% set tpl = ix_lib.base.render.Render(values) %}

{% set perm_container = tpl.deps.perms(values.consts.perms_container_name) %}

{% set pg_synapse_config = {
  "user": values.consts.db_synapse_user,
  "password": values.synapse.db_password,
  "database": values.consts.db_synapse_name,
  "volume": values.storage.postgres_synapse_data,
} %}
{% set postgres_synapse = tpl.deps.postgres(
  values.consts.postgres_synapse_container_name,
  values.synapse.postgres_image_selector,
  pg_synapse_config, perm_container
) %}

{% set pg_mas_config = {
  "user": values.consts.db_mas_user,
  "password": values.synapse.db_password,
  "database": values.consts.db_mas_name,
  "volume": values.storage.postgres_mas_data,
} %}
{% set postgres_synapse = tpl.deps.postgres(
  values.consts.postgres_mas_container_name,
  values.synapse.postgres_image_selector,
  pg_synapse_config, perm_container
) %}

{% set redis_config = {
  "password": values.synapse.redis_password,
  "volume": {"type": "temporary", "volume_config": {"volume_name": "redis-data"}},
} %}
{% set redis = tpl.deps.redis(values.consts.redis_container_name, "redis_image", redis_config, perm_container) %}

{% set proto = "http" %}



{% set c1 = tpl.add_container(values.consts.synapse_container_name, "image") %}
{% do c1.set_user(values.run_as.user, values.run_as.group) %}
{% do c1.healthcheck.set_test("wget", {"port": 8008, "path": "/health", "scheme": http}) %}

{% do c1.environment.add_user_envs(values.synapse.additional_envs) %}

{% do c1.depends.add_dependency(values.consts.postgres_synapse_container_name, "service_healthy") %}
{% do c1.depends.add_dependency(values.consts.redis_container_name, "service_healthy") %}

{% set perms_config = {"uid": values.run_as.user, "gid": values.run_as.group, "mode": "check"} %}
{% do c1.add_storage(values.consts.data_synapse_path, values.storage.data_synapse) %}
{% do perm_container.add_or_skip_action("data_synapse", values.storage.data_synapse, perms_config) %}


{% set c2 = tpl.add_container(values.consts.synapse_gen_worker_container_name, "image") %}
{% do c2.set_user(values.run_as.user, values.run_as.group) %}
{% do c2.healthcheck.set_test("wget", {"port": 8081, "path": "/health", "scheme": http}) %}

{% do c2.set_entrypoint(["/start.py", "run", "--config-path=/data/homeserver.yaml", "--config-path=/data/workers/synapse-generic-worker-1.yaml"]) %}

{% do c2.environment.add_user_envs(values.synapse.additional_envs) %}
{% do c2.environment.add_env("SYNAPSE_WORKER", "synapse.app.generic_worker") %}

{% do c2.depends.add_dependency(values.consts.synapse_container_name, "service_healthy") %}

{% do c2.add_storage(values.consts.data_synapse_path, values.storage.data_synapse) %}


{% set c3 = tpl.add_container(values.consts.synapse_fed_sender_container_name, "image") %}
{% do c3.set_user(values.run_as.user, values.run_as.group) %}
{% do c3.healthcheck.set_test("wget", {"port": 8081, "path": "/health", "scheme": http}) %}

{% do c3.set_entrypoint(["/start.py", "run", "--config-path=/data/homeserver.yaml", "--config-path=/data/workers/synapse-federation-sender-1.yaml"]) %}

{% do c3.environment.add_user_envs(values.synapse.additional_envs) %}
{% do c3.environment.add_env("SYNAPSE_WORKER", "synapse.app.federation_sender") %}

{% do c3.depends.add_dependency(values.consts.synapse_container_name, "service_healthy") %}

{% do c3.add_storage(values.consts.data_synapse_path, values.storage.data_synapse) %}


{% set c4 = tpl.add_container(values.consts.mas_container_name, "mas_image") %}
{% do c4.set_user(values.consts.mas_run_user, values.consts.mas_run_group) %}
{% do c4.healthcheck.set_test("wget", {"port": 8080, "path": "/health", "scheme": http}) %}

{% do c4.set_command("server --config=/data/config.yaml") %}

{% do c4.environment.add_user_envs(values.synapse.additional_envs) %}

{% do c4.depends.add_dependency(values.consts.postgres_mas_container_name, "service_healthy") %}

{% set perms_config = {"uid": values.run_as.user, "gid": values.run_as.group, "mode": "check"} %}
{% do c4.add_storage(values.consts.data_mas_path, values.storage.data_mas) %}
{% do perm_container.add_or_skip_action("data_mas", values.storage.data_mas, perms_config) %}

{% if perm_container.has_actions() %}
  {% do perm_container.activate() %}
  {% do c1.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
  {% do redis.container.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
  {% do postgres_synapse.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
{% endif %}

{% do tpl.portals.add(values.network.web_port, {"scheme": proto}) %}

{{ tpl.render() | tojson }}
